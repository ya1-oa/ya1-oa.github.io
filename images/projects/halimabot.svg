<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680"><rect width="1200" height="680" fill="#0c0812"/><rect x="210" y="55" width="780" height="570" rx="30" fill="#17101f" stroke="#533463"/><text x="260" y="110" fill="#d7a8e8" font-family="Arial" font-size="24" font-weight="700">HALIMABOT</text><g font-family="Arial" font-size="17"><rect x="270" y="160" width="510" height="88" rx="18" fill="#272033"/><text x="300" y="198" fill="#fff">I want to set a goal for this month.</text><text x="300" y="225" fill="#a898b2">Help me make it specific and realistic.</text><rect x="415" y="280" width="510" height="125" rx="18" fill="#432b51"/><text x="450" y="322" fill="#fff">Let’s turn that into three small actions.</text><text x="450" y="352" fill="#d8c4df">What outcome would feel meaningful?</text><rect x="270" y="450" width="655" height="80" rx="18" fill="#272033"/><text x="300" y="499" fill="#9687a1">Type a message…</text></g><circle cx="920" cy="100" r="18" fill="#00e87a"/></svg>
